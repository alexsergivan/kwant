[package]
name = "kwnt"
version = "0.1.0"
edition = "2021"
description = "A self-hosted team of AI bots: spaces, multiple accounts, handoffs, approvals and routines, in one binary"
license = "BUSL-1.1"
repository = "https://github.com/alexsergivan/kwant"
homepage = "https://kwant.si"
documentation = "https://kwant.si/docs/quickstart"
readme = "README.md"
keywords = ["ai", "agents", "llm", "self-hosted", "chatbot"]
categories = ["command-line-utilities", "web-programming::http-server"]
publish = false

[lib]
name = "kwnt"
path = "src/lib.rs"

[[bin]]
name = "kwnt"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
rust-embed = "8.5"
mime_guess = "2.0"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
thiserror = "1.0"
dirs = "5.0"
tokio-tungstenite = { version = "0.24", features = ["connect"] }
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
ring = "0.17"
base64 = "0.22"
url = "2"
tz-rs = "0.7"
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_norway = "0.9"
pdf-extract = "0.12"
# Bitwarden vault crypto (AES-256-CBC + HMAC, Argon2id KDF), done in process; see sandbox::bitwarden
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
argon2 = "0.5"
zeroize = "1"
# Zombie Mission Hunter: read-only IMAP (TLS via rustls, the same stack as reqwest) and mail parsing
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
