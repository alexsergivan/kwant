<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 452" width="340" height="452" role="img" aria-labelledby="t">
  <title id="t">Mock-up of the three macOS screens. Step 1: the alert “kwant” Not Opened, with Done marked. Step 2: System Settings, Privacy and Security. Step 3: under Security, “kwant” was blocked to protect your Mac, with the Open Anyway button marked.</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1b1033" flood-opacity=".18"/></filter>
    <g id="badge"><rect x="-12" y="-12" width="24" height="24" rx="4" fill="#4024a8" stroke="#fff" stroke-width="2"/></g>
  </defs>
  <rect width="340" height="452" fill="#efebfd"/>

  <!-- 1: the alert -->
  <g filter="url(#sh)"><rect x="40" y="18" width="260" height="168" rx="14" fill="#fbfaff"/></g>
  <rect x="40.5" y="18.5" width="259" height="167" rx="13.5" fill="none" stroke="#d8d4e6"/>
  <rect x="152" y="30" width="36" height="36" rx="8" fill="#4024a8"/>
  <rect x="160" y="41" width="6" height="7" fill="#fff"/><rect x="174" y="41" width="6" height="7" fill="#fff"/>
  <rect x="163" y="54" width="14" height="3" fill="#b8a9fb"/>
  <text x="170" y="90" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px" font-weight="700">“kwant” Not Opened</text>
  <text x="170" y="110" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#5d5873" font-size="13px">Apple could not verify “kwant”…</text>
  <rect x="54" y="134" width="110" height="34" rx="8" fill="#fff" stroke="#cfcbdc"/>
  <text x="109" y="156" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="13.5px">Move to Trash</text>
  <rect x="176" y="134" width="110" height="34" rx="8" fill="#3d3a4d"/>
  <text x="231" y="156" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#fff" font-size="14px" font-weight="600">Done</text>
  <rect x="170.5" y="128.5" width="121" height="45" rx="11" fill="none" stroke="#5c3fd0" stroke-width="3"/>
  <use href="#badge" x="40" y="18"/><text x="40" y="23" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#fff" font-size="13.5px" font-weight="800" text-anchor="middle">1</text>

  <!-- 2: where to go -->
  <rect x="20" y="206" width="300" height="44" rx="10" fill="#fff" stroke="#d8d4e6"/>
  <text x="40" y="233" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px">System Settings</text>
  <text x="153" y="233" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#5d5873" font-size="13px">›</text>
  <text x="167" y="233" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px" font-weight="700">Privacy &amp; Security</text>
  <use href="#badge" x="20" y="206"/><text x="20" y="211" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#fff" font-size="13.5px" font-weight="800" text-anchor="middle">2</text>

  <!-- 3: the Security row -->
  <rect x="20" y="270" width="300" height="164" rx="12" fill="#fff" stroke="#d8d4e6"/>
  <text x="40" y="298" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#5d5873" font-size="12.5px" font-weight="700">Security</text>
  <rect x="34" y="308" width="272" height="112" rx="9" fill="#f7f6fa" stroke="#e6e3ef"/>
  <path d="M56 322 l9 3.5 v7 c0 5.5 -4 9 -9 11 c-5 -2 -9 -5.5 -9 -11 v-7 z" fill="#8f8aa6"/>
  <text x="76" y="336" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px">“kwant” was blocked to</text>
  <text x="76" y="354" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px">protect your Mac.</text>
  <rect x="168" y="370" width="124" height="34" rx="8" fill="#fff" stroke="#cfcbdc"/>
  <text x="230" y="392" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#1b1033" font-size="14px" font-weight="600">Open Anyway</text>
  <rect x="162.5" y="364.5" width="135" height="45" rx="11" fill="none" stroke="#5c3fd0" stroke-width="3"/>
  <use href="#badge" x="20" y="270"/><text x="20" y="275" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif" fill="#fff" font-size="13.5px" font-weight="800" text-anchor="middle">3</text>
</svg>
