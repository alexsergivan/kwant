[package]
name = "kwant"
version = "0.7.0"
edition = "2021"
description = "kwant for Mac: the kwant server and its UI in one app, with a menu-bar icon"
license = "AGPL-3.0-only"
repository = "https://github.com/alexsergivan/kwant"
publish = false

# Its own workspace and lockfile: Tauri never enters the kwnt crate's build or ci.yml
# (Linux packages are built by linux.yml)
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kwnt = { path = "../.." }
# macos-private-api: the "needs you" pill is a transparent window (macOSPrivateApi in tauri.conf.json)
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde_json = "1.0"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# A second launch focuses the running app (macOS does this itself)
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Reads System Settings › Accessibility › Reduce motion for the nudge (already in the tree via Tauri)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }

# Desktop notifications for the nudge over D-Bus (already in the tree via the single-instance plugin)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"
