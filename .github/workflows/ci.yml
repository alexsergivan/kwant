name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes each of the ~70 test binaries hundreds of MB, which
  # fills the runner's disk and crashes the linker. CI doesn't need it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # The built website in site/: headings, meta, links, sitemap, and no unfilled {{PLACEHOLDER}} (the contact address on the
  # legal pages), so a half-filled page can't reach kwant.si unnoticed.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check_site.py
        run: python3 scripts/check_site.py
      # latest.json for in-app Mac updates
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # 077-ci-web-stage: the Dockerfile's web stage, as `docker compose up --build` runs it from source. It copies only
  # what it names, so a file the frontend build reads but the stage doesn't copy breaks source builds while the
  # frontend job (a full checkout) stays green. 0.7.6 shipped like that: vite.config.ts read ../CHANGELOG.md, the stage
  # had no CHANGELOG.md, and only the test server's build showed it.
  web-stage:
    name: web-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: docker build --target web
        env:
          DOCKER_BUILDKIT: 1
        run: docker build -f docker/kwnt.Dockerfile --target web --progress plain .

  # O9, the new-computer test on every release: kwnt starts as a brand-new user (empty HOME, `env -i`, a bare PATH
  # with no AI tools), and the job checks that the Get started card shows, that the one-click Claude Code install
  # starts and finishes against a stand-in download (the real one is never fetched: the fake curl refuses every
  # other URL), and that the sign-in starts. scripts/release_required_checks.txt lists it, so the release gate
  # (the release script reads that list) refuses a release commit where this job isn't green.
  # The first screen it checks is the Get started card ("Choose your AI", the Claude tile), found by CARD in
  # scripts/fresh_machine_test.py.
  fresh-machine:
    name: fresh-machine
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # The binary embeds frontend/dist, so the Rust build needs it
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fresh-machine
      - name: Build kwnt
        run: cargo build --locked --bin kwnt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Only the driver: the page check uses the runner's own Chrome, no browser download
      - name: Browser driver
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core
      - name: New computer (empty HOME, bare PATH, no AI tools, stand-in download)
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
        run: python3 scripts/fresh_machine_test.py --kwnt target/debug/kwnt --browser "$(command -v google-chrome || command -v chromium)"
      # 0.8.2: files dropped from Finder or Explorer must reach the chat. Real files go in through Chromium's own
      # drag path (CDP Input.dispatchDragEvent), on the same debug kwnt, which serves the frontend-dist artifact.
      # A JS dispatchEvent can't catch this bug (0.8.0 shipped with it green). Any failed case fails the job.
      - name: Native file drop (bot, room, #general, @mention, /idea, side pane, Import)
        timeout-minutes: 5
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          node frontend/e2e/native-drop.mjs target/debug/kwnt 9682 "$RUNNER_TEMP/native-drop"
      - name: Native file drop results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-drop
          path: ${{ runner.temp }}/native-drop
          retention-days: 7
      # P3: a performance budget on the same debug kwnt (no new build). Cold start, first reply (fake claude), idle memory
      # and the bot browser launch, each the median of 5 runs against scripts/perf_budget.json. Over a limit fails the step.
      # Not a required check yet: fresh-machine IS required for a release, so this step has continue-on-error: true. A FAIL stays
      # visible (the step, the job summary table, perf-results.json) but does not fail the job. Remove continue-on-error when
      # Ada makes the budget required (after a few days of numbers in the perf-results artifact).
      - name: Performance budget
        continue-on-error: true
        timeout-minutes: 10
        run: python3 scripts/perf_budget.py --kwnt target/debug/kwnt --browser "$(command -v google-chrome || command -v chromium)" --out "$RUNNER_TEMP/perf-results.json"
      - name: Performance budget results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf-results.json
          if-no-files-found: ignore
          retention-days: 30

  rust:
    name: rust
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      # The binary embeds frontend/dist, so the Rust build needs it
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # apps/mac has its own Cargo.lock; mac.yml only runs on PRs touching apps/mac,
      # so catch a root dependency that never made it into that lockfile here
      - name: Mac lockfile in sync
        run: cargo metadata --locked --format-version 1 --manifest-path apps/mac/Cargo.toml > /dev/null
      - name: Tests
        run: cargo test --locked --no-fail-fast
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target || true
