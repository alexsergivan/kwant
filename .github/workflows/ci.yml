name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes each of the ~70 test binaries hundreds of MB, which
  # fills the runner's disk and crashes the linker. CI doesn't need it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
      # pa5: the pocket guest page (dist/pocket) in Chrome under exactly pa1's CSP; any violation fails. Also the
      # 390 px shots of every state and the throttled first-paint numbers (results.json).
      - name: Guest page under the pocket CSP
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.65.0
          export PW_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs"
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          node guest/e2e/csp.mjs "$RUNNER_TEMP/guest-shots"
          node guest/e2e/remote.mjs "$RUNNER_TEMP/guest-shots"
          node guest/e2e/queue.mjs "$RUNNER_TEMP/guest-shots"
      - name: Guest page shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-shots
          path: ${{ runner.temp }}/guest-shots
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # The built website in site/: headings, meta, links, sitemap, and no unfilled {{PLACEHOLDER}} (the contact address on the
  # legal pages), so a half-filled page can't reach kwant.si unnoticed.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_site.py
        run: python3 scripts/check_site.py
      # latest.json for in-app Mac updates
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  # 077-ci-web-stage: the Dockerfile's web stage, as `docker compose up --build` runs it from source. It copies only
  # what it names, so a file the frontend build reads but the stage doesn't copy breaks source builds while the
  # frontend job (a full checkout) stays green. 0.7.6 shipped like that: vite.config.ts read ../CHANGELOG.md, the stage
  # had no CHANGELOG.md, and only the test server's build showed it.
  web-stage:
    name: web-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: docker build --target web
        env:
          DOCKER_BUILDKIT: 1
        run: docker build -f docker/kwnt.Dockerfile --target web --progress plain .

  # O9, the new-computer test on every release: kwnt starts as a brand-new user (empty HOME, `env -i`, a bare PATH
  # with no AI tools), and the job checks that the Get started card shows, that the one-click Claude Code install
  # starts and finishes against a stand-in download (the real one is never fetched: the fake curl refuses every
  # other URL), and that the sign-in starts. scripts/release_required_checks.txt lists it, so the release gate
  # (the release script reads that list) refuses a release commit where this job isn't green.
  # The first screen it checks is the Get started card ("Choose your AI", the Claude tile), found by CARD in
  # scripts/fresh_machine_test.py.
  fresh-machine:
    name: fresh-machine
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The binary embeds frontend/dist, so the Rust build needs it
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fresh-machine
      - name: Build kwnt
        run: cargo build --locked --bin kwnt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Only the driver: the page check uses the runner's own Chrome, no browser download
      - name: Browser driver
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core
      - name: New computer (empty HOME, bare PATH, no AI tools, stand-in download)
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
        run: python3 scripts/fresh_machine_test.py --kwnt target/debug/kwnt --browser "$(command -v google-chrome || command -v chromium)"
      # 0.8.2: files dropped from Finder or Explorer must reach the chat. Real files go in through Chromium's own
      # drag path (CDP Input.dispatchDragEvent), on the same debug kwnt, which serves the frontend-dist artifact.
      # A JS dispatchEvent can't catch this bug (0.8.0 shipped with it green). Any failed case fails the job.
      - name: Native file drop (bot, room, #general, @mention, /idea, side pane, Import)
        timeout-minutes: 5
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          node frontend/e2e/native-drop.mjs target/debug/kwnt 9682 "$RUNNER_TEMP/native-drop"
      - name: Native file drop results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-drop
          path: ${{ runner.temp }}/native-drop
          retention-days: 7
      # 36b (ux-a11y-1124/a11y-audit.md): axe-core against the real rendered app, on the same debug kwnt,
      # across the screens the audit flagged (first run, a sent message, Settings, New bot modal). Fails only
      # on serious/critical violations (the audit's threshold: it alone would have caught every regression
      # found). Not a required check yet, same continue-on-error precedent as Performance budget below;
      # remove it once the ranked findings above this threshold are clear.
      - name: Accessibility guard (axe-core, serious+critical)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PW_CORE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/axe" axe-core@4.14.1
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          export AXE_CORE="$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js"
          node frontend/e2e/a11y-check.mjs target/debug/kwnt 9684 "$RUNNER_TEMP/a11y-check"
      - name: Accessibility guard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-check
          path: ${{ runner.temp }}/a11y-check
          if-no-files-found: ignore
          retention-days: 7
      # P3: a performance budget on the same debug kwnt (no new build). Cold start, first reply (fake claude), idle memory
      # and the bot browser launch, each the median of 5 runs against scripts/perf_budget.json. It blocks (Ada, Nov 26,
      # perf-idle-memory #1265: with continue-on-error idle memory crept 109 -> 166 MB unseen): a median over its limit in a
      # measure listed under "blocking" in perf_budget.json fails this step and so the fresh-machine job. A measure that
      # is not blocking (browser_launch_s, until #1266) shows WARN in the summary and does not fail.
      - name: Performance budget
        # 3 memory runs also sync Find a tool's copy of a fake 75,000-entry registry (after_search_rss_mb)
        timeout-minutes: 20
        run: python3 scripts/perf_budget.py --kwnt target/debug/kwnt --browser "$(command -v google-chrome || command -v chromium)" --out "$RUNNER_TEMP/perf-results.json"
      - name: Performance budget results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf-results.json
          if-no-files-found: ignore
          retention-days: 30

  # perf-release-budget (0.9.56): the same performance budget on a release build, the binary people run. The debug
  # numbers above are inflated by ~40 MB of mapped debug code, so the <=120 MB idle target is judged here. Limits are
  # perf_budget.json's "release" object (the median of 3 CI runs + 15%); a blocking measure over its limit fails this job.
  # A release build takes ~10+ minutes, so a pull request runs it only when it touches the release build (src/, Cargo.*,
  # build.rs, scripts/perf_budget.*, this file: perf_budget.py RELEASE_RUN_PATHS); pushes to main always run it. A
  # skipped run passes, so the check never blocks a docs or frontend-only PR.
  perf-release:
    name: perf-release
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 45
    # THROWAWAY (probe draft): 3 samples on 3 machines for the limits; sample 1 also profiles the heap
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit: HEAD^1 is the base, so HEAD^1..HEAD is what the PR changes
          fetch-depth: 2
      - name: Does this change touch the release build?
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          run=$(git diff --name-only HEAD^1 HEAD | python3 scripts/perf_budget.py --needs-release-run)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" != true ]; then echo "perf-release: skipped, this PR does not touch the release build" | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.gate.outputs.run == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.gate.outputs.run == 'true'
        with:
          key: perf-release
      - name: Build kwnt (release)
        if: steps.gate.outputs.run == 'true'
        run: cargo build --release --locked --bin kwnt
      - name: Performance budget (release)
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        run: python3 scripts/perf_budget.py --profile release --kwnt target/release/kwnt --browser "$(command -v google-chrome || command -v chromium)" --out "$RUNNER_TEMP/perf-results-release.json"
      - name: Performance budget results (release)
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          # one per attempt, so a re-run (another sample for the limits) keeps the earlier file
          name: perf-results-release-${{ github.run_attempt }}-s${{ matrix.sample }}
          path: ${{ runner.temp }}/perf-results-release.json
          if-no-files-found: ignore
          retention-days: 30
      # THROWAWAY (probe draft): A3, one heaptrack profile of the same release kwnt at idle
      - name: Heap profile (heaptrack, idle)
        if: always() && matrix.sample == 1
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q heaptrack
          python3 scripts/heap_probe.py target/release/kwnt "$RUNNER_TEMP/heap"
          f=$(ls "$RUNNER_TEMP"/heap/kwnt-idle*.zst "$RUNNER_TEMP"/heap/kwnt-idle*.gz 2>/dev/null | head -1)
          heaptrack_print --print-leaks 1 --print-peaks 1 --print-temporary 0 --print-allocators 0 -n 25 -s 12 "$f" > "$RUNNER_TEMP/heap/heaptrack-print.txt" || true
          heaptrack_print --print-leaks 1 --print-peaks 0 --print-allocators 0 --merge-backtraces 0 -n 40 -s 0 "$f" > "$RUNNER_TEMP/heap/heaptrack-leaks-flat.txt" || true
          tail -c 20000 "$RUNNER_TEMP/heap/heaptrack-print.txt"
      - name: Heap profile results
        if: always() && matrix.sample == 1
        uses: actions/upload-artifact@v4
        with:
          name: heap-profile-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heap
          if-no-files-found: ignore
          retention-days: 30

  # Strict: GitHub sets CI=true, so a test whose precondition is missing (Chrome, ffmpeg, Xvfb, git)
  # fails instead of printing "skipped" and passing (tests/support/skip.rs). The Docker tests run in
  # docker-tests; what runs nowhere in CI is listed in tests/NOT_IN_CI.md.
  rust:
    name: rust
    runs-on: ubuntu-latest
    needs: frontend
    env:
      KWNT_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Test skips go through skip_or_fail
        run: python3 scripts/check_test_skips.py
      - name: Test tools
        run: scripts/ci_docker_tests.sh tools
      # The binary embeds frontend/dist, so the Rust build needs it
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # apps/mac has its own Cargo.lock; mac.yml only runs on PRs touching apps/mac,
      # so catch a root dependency that never made it into that lockfile here
      - name: Mac lockfile in sync
        run: cargo metadata --locked --format-version 1 --manifest-path apps/mac/Cargo.toml > /dev/null
      - name: Tests
        run: scripts/ci_docker_tests.sh rust-tests
      # Proves the rule itself: a browser test with Chrome hidden fails with CI=true and skips without
      - name: Strict fails, local skips
        run: scripts/ci_docker_tests.sh both-ways
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target || true

  # The agents-in-VM security tests, the VM browser container and the parallel harness need Docker
  # and kwant's own images. This job builds them (timed, in the job summary) and runs those tests
  # strict, so a missing image fails here instead of skipping. In parallel with rust, so its disk
  # and time stay as they were.
  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 60
    env:
      KWNT_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docker-tests
      - name: Build the images
        run: scripts/ci_docker_tests.sh images
      - name: Docker tests (strict)
        run: scripts/ci_docker_tests.sh run
      - name: Disk usage
        if: always()
        run: df -h / && docker system df && du -sh target || true
