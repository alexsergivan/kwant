name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes each of the ~70 test binaries hundreds of MB, which
  # fills the runner's disk and crashes the linker. CI doesn't need it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Tests
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # The built website in site/: headings, meta, links, sitemap, and no unfilled {{PLACEHOLDER}} (the contact address on the
  # legal pages), so a half-filled page can't reach kwant.si unnoticed.
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_site.py
        run: python3 scripts/check_site.py
      # latest.json for in-app Mac updates
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  rust:
    name: rust
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      # The binary embeds frontend/dist, so the Rust build needs it
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # apps/mac has its own Cargo.lock; mac.yml only runs on PRs touching apps/mac,
      # so catch a root dependency that never made it into that lockfile here
      - name: Mac lockfile in sync
        run: cargo metadata --locked --format-version 1 --manifest-path apps/mac/Cargo.toml > /dev/null
      - name: Tests
        run: cargo test --locked --no-fail-fast
      - name: Disk usage
        if: always()
        run: df -h / && du -sh target || true
