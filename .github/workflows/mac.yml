name: mac

# Builds kwant for Mac: a universal (Apple silicon + Intel), ad-hoc-signed .dmg.
# On pull requests and manual runs it is only a workflow artifact, proving the app builds and starts.
# Pushing a mac-v* tag (mac-v0.1.0, or mac-v0.2.0-rc.1 for a prerelease) also publishes a GitHub
# release with the .dmg as kwant_universal.dmg, which the site's "Download for Mac" links to via
# releases/latest/download/kwant_universal.dmg. The tag must match apps/mac's version.
#
# In-app updates: every build also makes the updater bundle (kwant.app.tar.gz + .sig). Tag builds
# sign it with the release key (secrets TAURI_SIGNING_PRIVATE_KEY / _PASSWORD) and a full release
# publishes it with latest.json, which installed apps read from releases/latest/download/latest.json.
# Pull requests and manual runs never see the release key: they sign with a throwaway key, so the
# same steps run without the secret. A full release needs a non-empty "## [Mac x.y.z]" CHANGELOG section,
# which becomes the update's notes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"
      - "scripts/mac_latest_json.py"
      - "scripts/minisign_verify.py"
  push:
    tags:
      - "mac-v*"

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  # never cancel a release half-way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that doesn't match the app's version fails here, before the 20-minute Mac build.
  version:
    name: version
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches apps/mac version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#mac-v}"
          base="${version%%-*}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/mac/Cargo.toml | head -1)
          tauri=$(python3 -c 'import json;print(json.load(open("apps/mac/tauri.conf.json"))["version"])')
          echo "tag $TAG -> $version (base $base); Cargo.toml $cargo; tauri.conf.json $tauri"
          if [ "$base" != "$cargo" ] || [ "$base" != "$tauri" ]; then
            echo "::error::tag $TAG doesn't match apps/mac version $cargo (tauri.conf.json $tauri)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"
          # a full release's update notes are its CHANGELOG section
          if [ "$version" = "$base" ]; then
            python3 scripts/mac_latest_json.py --check-notes --version "$version" --changelog CHANGELOG.md \
              || { echo "::error::CHANGELOG.md needs a non-empty \"## [Mac $version]\" section for the update notes"; exit 1; }
          fi

  dmg:
    name: dmg
    needs: version
    # runs on PRs and manual runs (version skipped), and on tags only after the version check passed
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # kwnt embeds frontend/dist, so the UI is built first
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mac
      - name: Unit tests (PATH merge, port choice)
        working-directory: apps/mac
        run: cargo test --locked
      # one multi-resolution TIFF so Finder draws the background sharp on Retina screens
      - name: Install-window background
        working-directory: apps/mac/dmg
        run: tiffutil -cathidpicheck background.png background@2x.png -out background.tiff
      # Finder's "every item" skips invisible files, so with hidden files off the layout script
      # leaves .VolumeIcon.icns and .background unplaced and Finder may drop them into the window
      # for anyone who shows hidden files. With them visible, the script moves them out of view.
      - name: Show hidden files in Finder while the .dmg is laid out
        run: |
          defaults write com.apple.finder AppleShowAllFiles -bool true
          killall Finder || true
          sleep 3
      # Pull requests and manual runs sign the updater bundle with a throwaway key; only tag builds
      # get the release key, so no PR code ever runs with it.
      - name: Throwaway updater key
        if: ${{ !startsWith(github.ref, 'refs/tags/mac-v') }}
        run: |
          set -euo pipefail
          openssl rand -hex 16 > "$RUNNER_TEMP/ci-updater.password"
          npx --yes @tauri-apps/cli@2.12.4 signer generate --ci -w "$RUNNER_TEMP/ci-updater.key" -p "$(cat "$RUNNER_TEMP/ci-updater.password")" > /dev/null
          cp "$RUNNER_TEMP/ci-updater.key.pub" "$RUNNER_TEMP/updater.pub"
      - name: Release updater key
        if: startsWith(github.ref, 'refs/tags/mac-v')
        run: python3 -c 'import json; print(json.load(open("apps/mac/tauri.conf.json"))["plugins"]["updater"]["pubkey"])' > "$RUNNER_TEMP/updater.pub"
      - name: Build the universal app and .dmg
        working-directory: apps/mac
        timeout-minutes: 30
        env:
          # Tauri skips the Finder AppleScript that lays out the install window (background,
          # icon positions, hidden files moved out of view) when CI=true; run it anyway
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/mac-v') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/mac-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/mac-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::the repository secret TAURI_SIGNING_PRIVATE_KEY is missing, so installed apps couldn't verify this release"
              exit 1
            fi
          else
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/ci-updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "$RUNNER_TEMP/ci-updater.password")
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx --yes @tauri-apps/cli@2.12.4 build --ci --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      # The installed app only accepts an update whose signature matches the key built into it and
      # whose signed version matches latest.json (requireSignedVersion). Checked here with the same
      # rules, so a bad bundle fails this job instead of every installed app.
      - name: Updater bundle and latest.json
        id: updater
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          tarball=macos/kwant.app.tar.gz
          ls -l "$tarball" "$tarball.sig"
          version=$(python3 -c 'import json; print(json.load(open("'"$GITHUB_WORKSPACE"'/apps/mac/tauri.conf.json"))["version"])')
          python3 -m venv "$RUNNER_TEMP/sigvenv"
          "$RUNNER_TEMP/sigvenv/bin/pip" install --quiet pynacl==1.6.2
          "$RUNNER_TEMP/sigvenv/bin/python" -I "$GITHUB_WORKSPACE/scripts/minisign_verify.py" \
            --pubkey "$RUNNER_TEMP/updater.pub" --file "$tarball" --signature "$tarball.sig" --version "$version"
          # the archive holds kwant.app and nothing else
          tar -tzf "$tarball" | cut -d/ -f1 | sort -u | tee "$RUNNER_TEMP/tar-top.txt"
          test "$(cat "$RUNNER_TEMP/tar-top.txt")" = "kwant.app"
          if grep -q "^## \[Mac $version\]" "$GITHUB_WORKSPACE/CHANGELOG.md"; then
            python3 "$GITHUB_WORKSPACE/scripts/mac_latest_json.py" --version "$version" --signature "$tarball.sig" \
              --changelog "$GITHUB_WORKSPACE/CHANGELOG.md" \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/mac-v$version/kwant_universal.app.tar.gz" \
              > "$RUNNER_TEMP/latest.json"
            cat "$RUNNER_TEMP/latest.json"
          else
            echo "::notice::no CHANGELOG section for Mac $version yet, so no sample latest.json"
          fi
          mkdir -p "$RUNNER_TEMP/updater"
          cp "$tarball" "$tarball.sig" "$RUNNER_TEMP/updater/"
      - uses: actions/upload-artifact@v4
        with:
          name: updater
          path: ${{ runner.temp }}/updater
          if-no-files-found: error
          retention-days: 14
      - name: Inspect the bundle
        id: bundle
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          app="macos/kwant.app"
          dmg=$(ls dmg/*.dmg)
          lipo -archs "$app/Contents/MacOS/kwant"
          lipo -archs "$app/Contents/MacOS/kwant" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/kwant" | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist"
          ls -l "$dmg"
          du -sh "$app"
          echo "dmg=$PWD/$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
      # The app icon must carry every size Finder and the Dock ask for (16-512, each with @2x).
      # The expanded iconset and Finder's render of the bundled app's icon are kept as an artifact.
      - name: App icon sizes
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        timeout-minutes: 5
        run: |
          set -euo pipefail
          res="macos/kwant.app/Contents/Resources"
          icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" macos/kwant.app/Contents/Info.plist)
          out="$RUNNER_TEMP/app-icon"
          mkdir -p "$out"
          iconutil --convert iconset "$res/${icon%.icns}.icns" --output "$out/icon.iconset"
          for s in 16 32 128 256 512; do
            for f in "icon_${s}x${s}.png:$s" "icon_${s}x${s}@2x.png:$((s * 2))"; do
              file="$out/icon.iconset/${f%%:*}"
              test "$(sips -g pixelWidth "$file" | awk '/pixelWidth/ {print $2}')" = "${f##*:}"
              echo "ok ${f%%:*} ${f##*:}px"
            done
          done
          # NSWorkspace gives the icon Finder shows for the app. Best effort, capped at a minute:
          # qlmanage hung on the headless runner.
          cat > "$RUNNER_TEMP/icon.js" <<'JS'
          ObjC.import('AppKit');
          function run(argv) {
            const img = $.NSWorkspace.sharedWorkspace.iconForFile(argv[0]);
            img.size = $.NSMakeSize(512, 512);
            const rep = $.NSBitmapImageRep.imageRepWithData(img.TIFFRepresentation);
            rep.representationUsingTypeProperties($.NSBitmapImageFileTypePNG, $({})).writeToFileAtomically(argv[1], true);
          }
          JS
          perl -e 'alarm 60; exec @ARGV' osascript -l JavaScript "$RUNNER_TEMP/icon.js" "$PWD/macos/kwant.app" "$out/finder-icon.png" \
            || echo "Finder icon render skipped"
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: app-icon
          path: ${{ runner.temp }}/app-icon
          if-no-files-found: error
          retention-days: 14
      - name: Smoke test, headless (kwant --check)
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        run: |
          macos/kwant.app/Contents/MacOS/kwant --check
          arch -x86_64 macos/kwant.app/Contents/MacOS/kwant --check
      - name: Smoke test, the real app from the .dmg
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/kwant-dmg "${{ steps.bundle.outputs.dmg }}"
          test -d /tmp/kwant-dmg/kwant.app
          test -L /tmp/kwant-dmg/Applications
          export KWNT_DATA_DIR="$RUNNER_TEMP/kwant-data"
          /tmp/kwant-dmg/kwant.app/Contents/MacOS/kwant > "$RUNNER_TEMP/kwant-app.out" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS http://127.0.0.1:8799/api/health 2>/dev/null); then ok=1; break; fi
            sleep 1
          done
          echo "health: ${body:-none}"
          ps -p $pid > /dev/null
          kill $pid || true
          wait $pid 2>/dev/null || true
          hdiutil detach /tmp/kwant-dmg || true
          cat "$KWNT_DATA_DIR/mac-app.log" || true
          test -n "$ok"
          echo "$body" | grep -q '"app":"kwnt"'
      # Opens the .dmg in Finder the way a person would, with hidden files shown, and screenshots
      # the window in light and dark mode. The layout check fails the job; the screenshots don't.
      - name: Install window layout and screenshots
        env:
          DMG: ${{ steps.bundle.outputs.dmg }}
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/dmg-window"
          mkdir -p "$shots"
          python3 -m venv "$RUNNER_TEMP/dsvenv"
          "$RUNNER_TEMP/dsvenv/bin/pip" install --quiet ds_store mac_alias
          hdiutil attach -readonly "$DMG" | tee "$shots/attach.txt"
          vol=$(grep -o '/Volumes/.*' "$shots/attach.txt" | head -1)
          ls -la "$vol" | tee "$shots/ls.txt"
          test -f "$vol/.background/background.tiff"
          "$RUNNER_TEMP/dsvenv/bin/python" - "$vol" <<'PY' | tee "$shots/ds_store.txt"
          import sys
          from ds_store import DSStore, store
          store.codecs.pop(b"pBBk", None)  # the background bookmark; mac_alias can't parse newer ones
          vol = sys.argv[1]
          with DSStore.open(vol + "/.DS_Store", "r") as d:
              entries = {(e.filename, e.code): e.value for e in d}
          for (name, code), value in sorted(entries.items()):
              print(name, code, value if code != b"icvp" else {k: v for k, v in value.items() if k != "backgroundImageAlias"})
          icvp = entries[(".", b"icvp")]
          assert icvp["iconSize"] == 128, icvp["iconSize"]
          assert icvp["backgroundType"] == 2 and "backgroundImageAlias" in icvp, "no background picture"
          bounds = entries[(".", b"bwsp")]["WindowBounds"]
          print("window", bounds)
          assert entries[("kwant.app", b"Iloc")] == (180, 170)
          assert entries[("Applications", b"Iloc")] == (480, 170)
          for name in (".VolumeIcon.icns", ".background"):
              x, y = entries[(name, b"Iloc")]
              assert x > 660 or y > 400, f"{name} is inside the window at {x},{y}"
          for (name, code), (x, y) in [(k, v) for k, v in entries.items() if k[1] == b"Iloc"]:
              if name.startswith("."):
                  assert x > 660 or y > 400, f"{name} is inside the window at {x},{y}"
          print("layout OK")
          PY
          hdiutil detach "$vol" || hdiutil detach -force "$vol"
          (
            set +e
            for mode in light dark; do
              if [ "$mode" = dark ]; then v=true; else v=false; fi
              osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $v"
              hdiutil attach -readonly "$DMG" > /dev/null
              open "$vol"; sleep 6
              osascript -e 'tell application "Finder" to get bounds of front window' > "$shots/bounds-$mode.txt"
              screencapture -x "$shots/screen-$mode.png"
              osascript -e 'tell application "Finder" to close every window'
              hdiutil detach "$vol" || hdiutil detach -force "$vol"
              sleep 2
            done
            ls -l "$shots"
            true
          )
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-window
          path: ${{ runner.temp }}/dmg-window
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.dmg }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [version, dmg]
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the only job that can write: it creates the release and uploads the .dmg
    permissions:
      contents: write
    steps:
      # for scripts/mac_latest_json.py and the CHANGELOG section it reads
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          dmg=$(find dist -type f -name '*.dmg' | head -1)
          test -n "$dmg"
          cp "$dmg" kwant_universal.dmg
          sha256sum kwant_universal.dmg > kwant_universal.dmg.sha256
          tarball=$(find dist -type f -name 'kwant.app.tar.gz' | head -1)
          test -n "$tarball" && test -f "$tarball.sig"
          cp "$tarball" kwant_universal.app.tar.gz
          cp "$tarball.sig" kwant_universal.app.tar.gz.sig
          assets=(kwant_universal.dmg kwant_universal.dmg.sha256 kwant_universal.app.tar.gz kwant_universal.app.tar.gz.sig)
          # Installed apps read releases/latest/download/latest.json, which only ever resolves to the
          # newest full release; a prerelease gets no latest.json, so it's never offered as an update
          if [ "$PRERELEASE" != "true" ]; then
            python3 scripts/mac_latest_json.py --version "$VERSION" --signature kwant_universal.app.tar.gz.sig \
              --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/kwant_universal.app.tar.gz" > latest.json
            cat latest.json
            assets+=(latest.json)
          fi
          cat > notes.md <<NOTES
          kwant for Mac $VERSION: one universal app for Apple silicon and Intel Macs (macOS 11 or later).

          **Install:** open \`kwant_universal.dmg\` and drag kwant to Applications.

          **First open:** the app is not notarized by Apple yet, so macOS blocks it the first time.
          1. Open kwant from Applications. macOS says it can't check it for malicious software. Click **Done** (or **OK**).
          2. Open **System Settings → Privacy & Security**, scroll down to the message about kwant and click **Open Anyway**.
          3. Confirm with **Open Anyway** and your password. From then on it opens normally.

          On macOS 14 or earlier you can instead right-click kwant in Applications and choose **Open**.

          The app runs kwant on your Mac with the same data folder as \`kwnt serve\` (\`~/.kwnt\`) and stays in the menu bar when you close the window.

          SHA-256: \`$(cut -d' ' -f1 kwant_universal.dmg.sha256)\`
          NOTES
          sed -i 's/^          //' notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "kwant for Mac $VERSION" --notes-file notes.md "${flags[@]}" \
            "${assets[@]}"
