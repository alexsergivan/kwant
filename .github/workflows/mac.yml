name: mac

# Builds kwant for Mac: a universal (Apple silicon + Intel), ad-hoc-signed .dmg.
# On pull requests and manual runs it is only a workflow artifact, proving the app builds and starts.
# Pushing a mac-v* tag (mac-v0.1.0, or mac-v0.2.0-rc.1 for a prerelease) also publishes a GitHub
# release with the .dmg as kwant_universal.dmg, which the site's "Download for Mac" links to via
# releases/latest/download/kwant_universal.dmg. The tag must match apps/mac's version.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mac/**"
      - ".github/workflows/mac.yml"
  push:
    tags:
      - "mac-v*"

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}
  # never cancel a release half-way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that doesn't match the app's version fails here, before the 20-minute Mac build.
  version:
    name: version
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches apps/mac version
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#mac-v}"
          base="${version%%-*}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/mac/Cargo.toml | head -1)
          tauri=$(python3 -c 'import json;print(json.load(open("apps/mac/tauri.conf.json"))["version"])')
          echo "tag $TAG -> $version (base $base); Cargo.toml $cargo; tauri.conf.json $tauri"
          if [ "$base" != "$cargo" ] || [ "$base" != "$tauri" ]; then
            echo "::error::tag $TAG doesn't match apps/mac version $cargo (tauri.conf.json $tauri)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$base" ]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  dmg:
    name: dmg
    needs: version
    # runs on PRs and manual runs (version skipped), and on tags only after the version check passed
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # kwnt embeds frontend/dist, so the UI is built first
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mac
      - name: Unit tests (PATH merge, port choice)
        working-directory: apps/mac
        run: cargo test --locked
      - name: Build the universal app and .dmg
        working-directory: apps/mac
        run: npx --yes @tauri-apps/cli@2 build --ci --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Inspect the bundle
        id: bundle
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        run: |
          set -euo pipefail
          app="macos/kwant.app"
          dmg=$(ls dmg/*.dmg)
          lipo -archs "$app/Contents/MacOS/kwant"
          lipo -archs "$app/Contents/MacOS/kwant" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/kwant" | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$app/Contents/Info.plist"
          ls -l "$dmg"
          du -sh "$app"
          echo "dmg=$PWD/$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
      - name: Smoke test, headless (kwant --check)
        working-directory: apps/mac/target/universal-apple-darwin/release/bundle
        run: |
          macos/kwant.app/Contents/MacOS/kwant --check
          arch -x86_64 macos/kwant.app/Contents/MacOS/kwant --check
      - name: Smoke test, the real app from the .dmg
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/kwant-dmg "${{ steps.bundle.outputs.dmg }}"
          test -d /tmp/kwant-dmg/kwant.app
          test -L /tmp/kwant-dmg/Applications
          export KWNT_DATA_DIR="$RUNNER_TEMP/kwant-data"
          /tmp/kwant-dmg/kwant.app/Contents/MacOS/kwant > "$RUNNER_TEMP/kwant-app.out" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS http://127.0.0.1:8799/api/health 2>/dev/null); then ok=1; break; fi
            sleep 1
          done
          echo "health: ${body:-none}"
          ps -p $pid > /dev/null
          kill $pid || true
          wait $pid 2>/dev/null || true
          hdiutil detach /tmp/kwant-dmg || true
          cat "$KWNT_DATA_DIR/mac-app.log" || true
          test -n "$ok"
          echo "$body" | grep -q '"app":"kwnt"'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: ${{ steps.bundle.outputs.dmg }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [version, dmg]
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the only job that can write: it creates the release and uploads the .dmg
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          dmg=$(find dist -type f -name '*.dmg' | head -1)
          test -n "$dmg"
          cp "$dmg" kwant_universal.dmg
          sha256sum kwant_universal.dmg > kwant_universal.dmg.sha256
          cat > notes.md <<NOTES
          kwant for Mac $VERSION: one universal app for Apple silicon and Intel Macs (macOS 11 or later).

          **Install:** open \`kwant_universal.dmg\` and drag kwant to Applications.

          **First open:** the app is not notarized by Apple yet, so macOS blocks it the first time.
          1. Open kwant from Applications. macOS says it can't check it for malicious software. Click **Done** (or **OK**).
          2. Open **System Settings → Privacy & Security**, scroll down to the message about kwant and click **Open Anyway**.
          3. Confirm with **Open Anyway** and your password. From then on it opens normally.

          On macOS 14 or earlier you can instead right-click kwant in Applications and choose **Open**.

          The app runs kwant on your Mac with the same data folder as \`kwnt serve\` (\`~/.kwnt\`) and stays in the menu bar when you close the window.

          SHA-256: \`$(cut -d' ' -f1 kwant_universal.dmg.sha256)\`
          NOTES
          sed -i 's/^          //' notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "kwant for Mac $VERSION" --notes-file notes.md "${flags[@]}" \
            kwant_universal.dmg kwant_universal.dmg.sha256
