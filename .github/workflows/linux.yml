name: linux

# Builds kwant for Linux (x86_64): a .deb and an AppImage, from the same apps/mac Tauri app.
# tauri.linux.conf.json switches the bundle targets; the Mac config and mac.yml are untouched.
# On pull requests and manual runs the packages are only a workflow artifact, proving the app builds,
# installs and starts. A mac-v* tag runs this from mac.yml (workflow_call), and mac.yml's release
# job puts the packages in the same GitHub release as the Mac app, with one latest.json for both,
# so installed Macs keep finding their updates.
#
# Built on ubuntu-22.04 so the AppImage runs on distros with glibc 2.35 or newer. The updater
# artifacts (.AppImage.sig, .deb.sig) are signed with a throwaway key on pull requests and manual
# runs; only tag builds get the release key, so no PR code ever runs with it.
#
# For AppImage tools and the AppImage catalog (appimage.github.io), the AppImage carries update
# information that points at kwant_x86_64.AppImage.zsync in the latest GitHub release, and both
# packages carry AppStream metainfo (apps/mac/linux/si.kwant.kwant.appdata.xml). The .zsync is made
# here, under the release file name, so pull requests exercise it too; the "catalog checks" job
# validates all of it from the uploaded artifact, the way the catalog's own test does.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mac/**"
      - ".github/workflows/linux.yml"
      - "scripts/minisign_verify.py"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  # never cancel a release half-way
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # AppImageUpdate and the catalog read this from the AppImage's .upd_info section
  APPIMAGE_UPDATE_INFORMATION: "gh-releases-zsync|alexsergivan|kwant|latest|kwant_x86_64.AppImage.zsync"

jobs:
  appimage-deb:
    name: appimage + deb
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (WebKitGTK, GTK, tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth zsync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # kwnt embeds frontend/dist, so the UI is built first
      - name: Build the web UI
        working-directory: frontend
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/mac
      - name: Unit tests (PATH merge, port choice, links)
        working-directory: apps/mac
        run: cargo test --locked
      - name: Throwaway updater key
        if: ${{ !startsWith(github.ref, 'refs/tags/mac-v') }}
        run: |
          set -euo pipefail
          openssl rand -hex 16 > "$RUNNER_TEMP/ci-updater.password"
          npx --yes @tauri-apps/cli@2.12.4 signer generate --ci -w "$RUNNER_TEMP/ci-updater.key" -p "$(cat "$RUNNER_TEMP/ci-updater.password")" > /dev/null
          cp "$RUNNER_TEMP/ci-updater.key.pub" "$RUNNER_TEMP/updater.pub"
      - name: Release updater key
        if: startsWith(github.ref, 'refs/tags/mac-v')
        run: python3 -c 'import json; print(json.load(open("apps/mac/tauri.conf.json"))["plugins"]["updater"]["pubkey"])' > "$RUNNER_TEMP/updater.pub"
      # The packaged metainfo names the version being built, dated by its CHANGELOG section
      # (today on pull requests that come before one).
      - name: AppStream release entry
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("apps/mac/tauri.conf.json"))["version"])')
          date=$(sed -n "s/^## \[Mac ${version//./\\.}\] - \([0-9-]*\).*/\1/p" CHANGELOG.md | head -1)
          [ -n "$date" ] || date=$(date -u +%F)
          python3 - "$version" "$date" apps/mac/linux/si.kwant.kwant.appdata.xml <<'PY'
          import re, sys
          version, date, path = sys.argv[1:]
          text = open(path).read()
          text, n = re.subn(r'<release version="[^"]*" date="[^"]*"/>', f'<release version="{version}" date="{date}"/>', text, count=1)
          if n != 1:
              sys.exit(f"no <release> entry in {path}")
          open(path, "w").write(text)
          PY
          grep -n '<release ' apps/mac/linux/si.kwant.kwant.appdata.xml
      - name: Build the .deb and AppImage
        working-directory: apps/mac
        timeout-minutes: 30
        env:
          # linuxdeploy-plugin-appimage embeds it before Tauri signs the AppImage, so the .sig stays valid
          LDAI_UPDATE_INFORMATION: ${{ env.APPIMAGE_UPDATE_INFORMATION }}
          UPDATE_INFORMATION: ${{ env.APPIMAGE_UPDATE_INFORMATION }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/mac-v') }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/mac-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/mac-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              echo "::error::the repository secret TAURI_SIGNING_PRIVATE_KEY is missing, so installed apps couldn't verify this release"
              exit 1
            fi
          else
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/ci-updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(cat "$RUNNER_TEMP/ci-updater.password")
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          npx --yes @tauri-apps/cli@2.12.4 build --ci --bundles deb,appimage \
            --config '{"bundle":{"createUpdaterArtifacts":true}}' -- --locked
      # The installed app only accepts an update whose signature matches the key built into it and
      # whose signed version matches latest.json (requireSignedVersion); same check as mac.yml.
      - name: Updater signatures
        id: bundle
        working-directory: apps/mac/target/release/bundle
        run: |
          set -euo pipefail
          deb=$(ls deb/*.deb)
          appimage=$(ls appimage/*.AppImage)
          ls -l "$deb" "$deb.sig" "$appimage" "$appimage.sig"
          version=$(python3 -c 'import json; print(json.load(open("'"$GITHUB_WORKSPACE"'/apps/mac/tauri.conf.json"))["version"])')
          python3 -m venv "$RUNNER_TEMP/sigvenv"
          "$RUNNER_TEMP/sigvenv/bin/pip" install --quiet pynacl==1.6.2
          for f in "$deb" "$appimage"; do
            "$RUNNER_TEMP/sigvenv/bin/python" -I "$GITHUB_WORKSPACE/scripts/minisign_verify.py" \
              --pubkey "$RUNNER_TEMP/updater.pub" --file "$f" --signature "$f.sig" --version "$version"
          done
          echo "deb=$PWD/$deb" >> "$GITHUB_OUTPUT"
          echo "appimage=$PWD/$appimage" >> "$GITHUB_OUTPUT"
      # The static AppImage runtime answers this without FUSE
      - name: AppImage update information
        env:
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE"
          info=$("$APPIMAGE" --appimage-updateinformation | tr -d '\000' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          echo "update information: $info"
          if [ "$info" != "$APPIMAGE_UPDATE_INFORMATION" ]; then
            echo "::error::the AppImage's update information is \"$info\", expected \"$APPIMAGE_UPDATE_INFORMATION\""
            exit 1
          fi
      - name: Inspect the packages
        env:
          DEB: ${{ steps.bundle.outputs.deb }}
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | tee "$RUNNER_TEMP/deb-files.txt"
          grep -Eq ' (\./)?usr/bin/kwant$' "$RUNNER_TEMP/deb-files.txt"
          grep -Eq ' (\./)?usr/share/applications/kwant\.desktop$' "$RUNNER_TEMP/deb-files.txt"
          grep -Eq ' (\./)?usr/share/icons/hicolor/[^/]+/apps/kwant\.png$' "$RUNNER_TEMP/deb-files.txt"
          grep -Eq ' (\./)?usr/share/metainfo/si\.kwant\.kwant\.appdata\.xml$' "$RUNNER_TEMP/deb-files.txt"
          depends=$(dpkg-deb -f "$DEB" Depends)
          echo "Depends: $depends"
          for dep in libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 python3-venv xdg-utils; do
            echo "$depends" | grep -q "$dep" || { echo "::error::the .deb doesn't depend on $dep"; exit 1; }
          done
          du -h "$DEB" "$APPIMAGE"
      - name: Smoke test, headless (kwant --check)
        working-directory: apps/mac/target/release
        run: ./kwant --check
      # Installs the .deb the way a person would (apt pulls its Depends), opens the real app on a
      # virtual display and waits for /api/health. The log is printed either way.
      - name: Smoke test, the installed .deb
        env:
          DEB: ${{ steps.bundle.outputs.deb }}
        run: |
          set -euo pipefail
          sudo apt-get install -y "$DEB"
          test -x /usr/bin/kwant
          export KWNT_DATA_DIR="$RUNNER_TEMP/kwant-data-deb"
          xvfb-run -a dbus-run-session -- /usr/bin/kwant > "$RUNNER_TEMP/kwant-deb.out" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS http://127.0.0.1:8799/api/health 2>/dev/null); then ok=1; break; fi
            sleep 1
          done
          echo "health: ${body:-none}"
          # the app is still running (not crashed after the server came up)
          sleep 3
          kill -0 $pid || { echo "::error::kwant exited"; ok=""; }
          pkill -x kwant || true
          wait $pid 2>/dev/null || true
          cat "$RUNNER_TEMP/kwant-deb.out" || true
          cat "$KWNT_DATA_DIR/desktop-app.log" || true
          test -n "$ok"
          echo "$body" | grep -q '"app":"kwnt"'
          sudo apt-get remove -y kwant
      # Docker-free runners have no FUSE for AppImages, so it runs extracted, as on a desktop
      # without libfuse2.
      - name: Smoke test, the AppImage
        env:
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          chmod +x "$APPIMAGE"
          export KWNT_DATA_DIR="$RUNNER_TEMP/kwant-data-appimage"
          xvfb-run -a dbus-run-session -- "$APPIMAGE" --appimage-extract-and-run > "$RUNNER_TEMP/kwant-appimage.out" 2>&1 &
          pid=$!
          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS http://127.0.0.1:8799/api/health 2>/dev/null); then ok=1; break; fi
            sleep 1
          done
          echo "health: ${body:-none}"
          sleep 3
          kill -0 $pid || { echo "::error::kwant exited"; ok=""; }
          pkill -x kwant || true
          wait $pid 2>/dev/null || true
          cat "$RUNNER_TEMP/kwant-appimage.out" || true
          cat "$KWNT_DATA_DIR/desktop-app.log" || true
          test -n "$ok"
          echo "$body" | grep -q '"app":"kwnt"'
      - name: Collect the packages
        env:
          DEB: ${{ steps.bundle.outputs.deb }}
          APPIMAGE: ${{ steps.bundle.outputs.appimage }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux"
          mkdir -p "$out"
          cp "$DEB" "$DEB.sig" "$APPIMAGE" "$APPIMAGE.sig" "$out/"
          # The .zsync AppImageUpdate fetches, made over these exact bytes under the name the release
          # gives them (any .zsync the bundler wrote has the old name and is ignored)
          zs="$RUNNER_TEMP/zsync"
          mkdir -p "$zs"
          cp "$APPIMAGE" "$zs/kwant_x86_64.AppImage"
          (cd "$zs" && zsyncmake -u kwant_x86_64.AppImage -o "$out/kwant_x86_64.AppImage.zsync" kwant_x86_64.AppImage)
          head -c 400 "$out/kwant_x86_64.AppImage.zsync" | sed -n '/^$/q;p'
          want=$(sha1sum "$APPIMAGE" | cut -d' ' -f1)
          got=$(sed -n 's/^SHA-1: //p' "$out/kwant_x86_64.AppImage.zsync" | head -1)
          [ "$got" = "$want" ] || { echo "::error::the .zsync's SHA-1 $got doesn't match the AppImage's $want"; exit 1; }
          grep -qx 'Filename: kwant_x86_64.AppImage' "$out/kwant_x86_64.AppImage.zsync"
          grep -qx 'URL: kwant_x86_64.AppImage' "$out/kwant_x86_64.AppImage.zsync"
          cd "$out"
          for f in *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ runner.temp }}/linux
          if-no-files-found: error
          retention-days: 14

  # What the AppImage catalog's test checks, on the packages as uploaded: AppStream metainfo
  # (appstreamcli validate-tree, as the catalog runs it on ubuntu-latest), the desktop file, the
  # update information and the .zsync next to it.
  catalog-checks:
    name: catalog checks
    needs: appimage-deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils
          appstreamcli --version
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: linux
      - name: Unpack the packages
        working-directory: linux
        run: |
          set -euo pipefail
          appimage=$(ls *_amd64.AppImage)
          deb=$(ls *_amd64.deb)
          chmod +x "$appimage"
          "./$appimage" --appimage-extract > /dev/null
          mv squashfs-root "$RUNNER_TEMP/appdir"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/debroot"
          echo "APPIMAGE=$PWD/$appimage" >> "$GITHUB_ENV"
      - name: AppStream metainfo
        run: |
          set -euo pipefail
          for root in "$RUNNER_TEMP/appdir" "$RUNNER_TEMP/debroot"; do
            f="$root/usr/share/metainfo/si.kwant.kwant.appdata.xml"
            test -f "$f"
            grep -n '<release ' "$f"
            appstreamcli validate --no-net --pedantic "$f"
            appstreamcli validate-tree --pedantic "$root"
          done
      - name: Desktop file
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP/appdir/usr/share/applications/kwant.desktop" "$RUNNER_TEMP/debroot/usr/share/applications/kwant.desktop"; do
            cat "$f"
            desktop-file-validate "$f"
          done
      - name: Update information and .zsync
        working-directory: linux
        run: |
          set -euo pipefail
          info=$("$APPIMAGE" --appimage-updateinformation | tr -d '\000' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          echo "update information: $info"
          [ "$info" = "$APPIMAGE_UPDATE_INFORMATION" ] || { echo "::error::expected \"$APPIMAGE_UPDATE_INFORMATION\""; exit 1; }
          zsync_file=$(echo "$info" | cut -d'|' -f5)
          test -f "$zsync_file"
          want=$(sha1sum "$APPIMAGE" | cut -d' ' -f1)
          got=$(sed -n 's/^SHA-1: //p' "$zsync_file" | head -1)
          echo "SHA-1: AppImage $want, .zsync $got"
          [ "$got" = "$want" ] || { echo "::error::the .zsync's SHA-1 doesn't match the AppImage"; exit 1; }
