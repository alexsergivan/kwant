title: Page not found
description: This page doesn't exist. Head back to the kwant home page or the docs.
path: 404.html
---
<section class="notfound" aria-labelledby="nf-title">
  <div class="wrap nf-grid">
    <div>
      <p class="kicker">404 · not found</p>
      <h1 id="nf-title">This page wandered off</h1>
      <p class="lede">The link may be old, or the page has moved.</p>
      <div class="cta">
        <a class="btn btn-violet" href="/">Go home</a>
        <a class="btn btn-soft" href="/docs/quickstart">Read the docs</a>
      </div>
    </div>
    <div class="crt crt-small">
      <div class="crt-screen street-screen">
        <div class="scene street" data-scene="street" data-lost><canvas aria-hidden="true"></canvas></div>
      </div>
    </div>
  </div>
</section>
