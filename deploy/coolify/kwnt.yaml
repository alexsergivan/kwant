# documentation: https://kwant.si/docs/install
# slogan: Your own team of AI bots that check each other's work before saying done.
# category: ai
# tags: ai,agents,bots,automation,llm,claude,codex,self-hosted
# logo: svgs/kwnt.svg
# port: 8799

services:
  kwnt:
    image: "ghcr.io/alexsergivan/kwnt:0.9.17"
    environment:
      - SERVICE_URL_KWNT_8799
      # The sign-in token: Coolify makes it, and shows it in this service's Environment Variables.
      - KWNT_API_TOKEN=${SERVICE_PASSWORD_64_KWNT}
      - KWNT_ALLOWED_ORIGINS=${SERVICE_URL_KWNT}
      - "KWNT_SIGNIN_HINT=Use the password Coolify made for kwnt: open this service's Environment Variables in Coolify and copy SERVICE_PASSWORD_64_KWNT."
    volumes:
      - "kwnt-data:/data"
    healthcheck:
      test:
        - CMD
        - bash
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8799 && printf 'GET /api/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 10s
      retries: 10
volumes:
  kwnt-data: null
